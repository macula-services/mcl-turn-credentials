<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-label="mcl-turn-credentials system context">
<title>mcl-turn-credentials system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="680"/>
<rect class="b-per" x="40" y="30" width="270" height="120" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Caller</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">A client app, or the ICE agent</text>
<text class="t-desc" x="56" y="116">inside it, that needs a TURN</text>
<text class="t-desc" x="56" y="132">allocation</text>
<rect class="b-per" x="690" y="30" width="270" height="104" rx="10"/>
<circle class="head" cx="716" cy="54" r="9"/>
<text class="t-name" x="734" y="58">Service operator</text>
<text class="t-type" x="734" y="76">[Person]</text>
<text class="t-desc" x="706" y="100">Deploys the release and supplies</text>
<text class="t-desc" x="706" y="116">TURN_SHARED_SECRET from the host</text>
<rect class="b-sys" x="365" y="186" width="270" height="138" rx="10"/>
<text class="t-name" x="381" y="214">mcl-turn-credentials</text>
<text class="t-type" x="381" y="232">[mcl_om mesh service]</text>
<text class="t-desc" x="381" y="256">Serves its own procedure,</text>
<text class="t-desc" x="381" y="272">mcl-turn-credentials/mint_credential,</text>
<text class="t-desc" x="381" y="288">and /health on 8485. Holds the</text>
<text class="t-desc" x="381" y="304">secret; never places a call</text>
<rect class="b-ext" x="40" y="392" width="270" height="120" rx="10"/>
<text class="t-name" x="56" y="420">coturn TURN server</text>
<text class="t-type" x="56" y="438">[External system]</text>
<text class="t-desc" x="56" y="462">Derives the same username and</text>
<text class="t-desc" x="56" y="478">password from the same secret at</text>
<text class="t-desc" x="56" y="494">ALLOCATE, so nothing is sent to it</text>
<rect class="b-mac" x="365" y="392" width="270" height="136" rx="10"/>
<text class="t-name" x="381" y="420">macula-realm</text>
<text class="t-type" x="381" y="438">[Macula infrastructure]</text>
<text class="t-desc" x="381" y="462">Endorses the node's identity key</text>
<text class="t-desc" x="381" y="478">and grants a provider authorization</text>
<text class="t-desc" x="381" y="494">per org procedure: its own, and the</text>
<text class="t-desc" x="381" y="510">open info and get_limits</text>
<rect class="b-mac" x="690" y="392" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="420">Macula stations, mesh DHT</text>
<text class="t-type" x="706" y="438">[Macula infrastructure]</text>
<text class="t-desc" x="706" y="462">The pinned stations are its mesh</text>
<text class="t-desc" x="706" y="478">entry points (QUIC); the mesh DHT</text>
<text class="t-desc" x="706" y="494">takes the endpoint it announces</text>
<path class="edge" d="M175 150V168H400V186" marker-end="url(#a)"/>
<text class="t-rel" x="183" y="182">calls mint_credential,</text>
<text class="t-rel" x="183" y="198">and is answered</text>
<path class="edge" d="M825 134V168H620V186" marker-end="url(#a)"/>
<text class="t-rel" x="596" y="152">deploys; sets TURN_SHARED_SECRET</text>
<path class="edge" d="M420 324V392" marker-end="url(#a)"/>
<text class="t-rel" x="428" y="352">boot claim, scope</text>
<path class="edge" d="M620 324V360H825V392" marker-end="url(#a)"/>
<text class="t-rel" x="632" y="352">its endpoint is republished periodically</text>
<path class="edge" d="M40 80H20V456H40" marker-end="url(#a)"/>
<text class="t-rel" x="24" y="268" text-anchor="middle" transform="rotate(-90 24 268)">ALLOCATE with the minted pair</text>
<text class="t-desc" x="40" y="566">The service never calls coturn: both sides derive the same pair from TURN_SHARED_SECRET, so the</text>
<text class="t-desc" x="40" y="584">master secret stays on the box instead of shipping inside every client app.</text>
<rect class="b-sys" x="24" y="630" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="642">In scope</text>
<rect class="b-per" x="110.8" y="630" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="642">Person</text>
<rect class="b-mac" x="184.39999999999998" y="630" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="642">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="630" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="642">External system</text>
<rect class="b-cmp" x="490.0" y="630" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="642">Container or component</text>
</svg>
