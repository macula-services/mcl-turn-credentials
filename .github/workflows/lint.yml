# Structural lint, unit tests and dialyzer, in the same digest-pinned build
# image the Containerfile's builder uses: OTP 28.4.3, rebar3 and Rust (macula's
# NIFs always build from source).

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # build-push.yml runs this on the commit it builds, and pushes no image
  # until it is green (mcl-om#34).
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # ⚠ THE SAME DIGEST-PINNED BUILD IMAGE AS THE Containerfile. Its tag names
      # a date, not a release, so the step below refuses anything but 28.4.3.
      # The service tests guard this pin and that check.
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1444@sha256:dd2ba6eb858a0eacedf0179300323fe5c6da46fb308d22da0ca8cfcd1f0718dc
    steps:
      - uses: actions/checkout@v4
      - name: Verify the toolchain is the one we think it is
        run: |
          openssl version
          rebar3 version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'
      - run: rebar3 lint
      - run: rebar3 eunit
      - run: rebar3 dialyzer

  # A dependency the release ships with a published advisory fails this, and so
  # the image: build-push.yml's build waits on this workflow
  # (macula-services/mcl-turn-credentials#3, macula-codebase-checks#11). Erlang
  # reads the resolved rebar.lock as an SBOM, to osv-scanner. No baseline: an
  # advisory is fixed, or waived in .github/advisories-waivers.txt by a dated,
  # named, expiring row.
  #
  # A HOSTED RUNNER, because this repository is public; `--user 1001:1001' is
  # that runner's own user, since the shared workflow refuses uid 0.
  #
  # THE IMAGE IS NEWER THAN check's, ON PURPOSE (20261031-2106 against
  # 20260923-1444): the scan is a Python script and the older image has no
  # python3. Both run OTP 28.4.3, so the lock this scans resolves as the
  # release resolves it. Unifying the two pins moves the Containerfile's
  # builder, a release change of its own.
  advisories:
    name: Dependency advisories
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/dependency-advisories.yml@553b29210236d200149735c7805050f3b94a8965
    with:
      ecosystem: erlang
      container: ghcr.io/macula-io/macula-ci-otp:20261031-2106@sha256:f2532c6ad37c2c0194937b4a0aafc2fcfa4e32e734602fae782f764a94f9cd99
      container-options: '--user 1001:1001'
